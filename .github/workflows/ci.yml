name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  saludo:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Saludar
        run: echo "Hola desde GitHub Actions"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm test
